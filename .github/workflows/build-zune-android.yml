name: Build and Publish ZUNE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-zune-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Calculate app version
        run: |
          echo "ZUNE_VERSION_CODE=$((${GITHUB_RUN_NUMBER}+1))" >> "$GITHUB_ENV"
          echo "ZUNE_VERSION_NAME=1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ZUNE_TAG=v1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare release signing key
        env:
          ZUNE_RELEASE_KEY_BASE64: ${{ secrets.ZUNE_RELEASE_KEY_BASE64 }}
        run: |
          test -n "$ZUNE_RELEASE_KEY_BASE64"
          echo "$ZUNE_RELEASE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/zune-release.jks"
          test -s "$RUNNER_TEMP/zune-release.jks"
          echo "ZUNE_KEYSTORE_PATH=$RUNNER_TEMP/zune-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ZUNE_KEYSTORE_PASSWORD: ${{ secrets.ZUNE_KEYSTORE_PASSWORD }}
          ZUNE_KEY_ALIAS: ${{ secrets.ZUNE_KEY_ALIAS }}
          ZUNE_KEY_PASSWORD: ${{ secrets.ZUNE_KEY_PASSWORD }}
        run: |
          test -n "$ZUNE_KEYSTORE_PASSWORD"
          test -n "$ZUNE_KEY_ALIAS"
          test -n "$ZUNE_KEY_PASSWORD"
          gradle -p android-app :app:assembleRelease
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/ZUNE.apk

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ZUNE_TAG }}
          name: ZUNE ${{ env.ZUNE_VERSION_NAME }}
          body: |
            versionCode=${{ env.ZUNE_VERSION_CODE }}

            - ZUNE checks for app updates when it opens.
            - Shows release notes and lets users download and install updates.
            - Marketplace content loads from the latest hosted version.
          files: android-app/app/build/outputs/apk/release/ZUNE.apk
          fail_on_unmatched_files: true
          make_latest: true
