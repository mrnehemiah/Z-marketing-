plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.zune.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zune.app'
        minSdk 23
        targetSdk 35
        versionCode = (System.getenv("ZUNE_VERSION_CODE") ?: "2").toInteger()
        versionName = (System.getenv("ZUNE_VERSION_NAME") ?: "1.1.0")
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ZUNE_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ZUNE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZUNE_KEY_ALIAS")
                keyPassword System.getenv("ZUNE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Keep the Firebase-registered applicationId identical for debug and release builds.
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (System.getenv("ZUNE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}