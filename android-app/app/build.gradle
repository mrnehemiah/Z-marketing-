plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zune.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zune.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('ZUNE_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ZUNE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ZUNE_KEY_ALIAS')
                keyPassword System.getenv('ZUNE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ZUNE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
